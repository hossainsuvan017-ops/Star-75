<style>
:root{--bg:#080d18;--panel:#101a2a;--card:#152237;--card2:#1a2b42;--blue:#00cfff;--gold:#f5bd45;--red:#ff4967;--text:#f5f7fb;--muted:#a7b4c8;--line:#29415c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top,#14263b 0,#080d18 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.hidden{display:none!important}.app{max-width:1500px;margin:auto;padding-bottom:90px}.topbar{height:68px;display:flex;align-items:center;gap:20px;padding:0 22px;position:sticky;top:0;z-index:20;background:#080d18eF;border-bottom:1px solid #26394d;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:9px;min-width:170px;border:0;background:none;color:white;font-weight:900;font-size:22px;letter-spacing:.5px}.logo{width:42px;height:35px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,#00cfff,#1265c7);color:#fff;position:relative;font-weight:1000;font-size:23px;box-shadow:0 5px 20px #00cfff30}.logo:after{content:"7";position:absolute;color:var(--gold);font-size:28px;left:21px;top:0;text-shadow:0 2px 6px #000}.brand span:last-child{white-space:nowrap}.brand b{color:var(--gold)}.navlinks{display:flex;gap:8px;align-items:center;flex:1}.navbtn,.iconbtn{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:9px}.navbtn.active,.navbtn:hover,.iconbtn:hover{background:#1a2c42;color:#fff}.topactions{display:flex;gap:8px;align-items:center}.searchbox{width:min(260px,25vw);background:#101a2a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#fff}.primary,.goldbtn,.secondary,.danger{border:0;border-radius:9px;padding:11px 16px;font-weight:750}.primary{background:linear-gradient(110deg,#00cfff,#1876e9);color:#00111d}.goldbtn{background:linear-gradient(110deg,#ffe18a,#dba42e);color:#211700}.secondary{background:#24374e;color:#fff;border:1px solid #38516d}.danger{background:#592638;color:#fff}.page{padding:22px}.hero{min-height:370px;border:1px solid #2a4158;border-radius:20px;overflow:hidden;display:flex;align-items:end;padding:34px;position:relative;background:linear-gradient(90deg,#07101df5 0%,#091421d9 40%,#09142120 100%),linear-gradient(0deg,#07101de8 0%,transparent 65%),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=85') center/cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07101d88,transparent 75%);pointer-events:none}.heroContent{position:relative;z-index:1;max-width:590px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:900}.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.02;margin:12px 0}.hero p{color:#d3dceb;max-width:540px;line-height:1.6}.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 13px}.rowhead h2{font-size:20px;margin:0}.textbtn{background:none;border:0;color:var(--blue);font-weight:700}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.card{min-width:0;background:var(--panel);border:1px solid #24394f;border-radius:13px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#00cfff88;box-shadow:0 12px 28px #0004}.poster{aspect-ratio:2/2.7;position:relative;overflow:hidden;background:linear-gradient(135deg,#1b4260,#101626)}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;background:linear-gradient(135deg,#17486a,#101726 75%);font-weight:900;font-size:19px}.badge{position:absolute;top:8px;left:8px;background:#f5bd45;color:#231900;padding:4px 7px;border-radius:5px;font-size:10px;font-weight:900}.lock{position:absolute;right:8px;top:8px;background:#000b;padding:5px 7px;border-radius:6px}.cardinfo{padding:10px}.cardinfo strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.cardinfo small{display:block;color:var(--muted);margin-top:5px}.progress{height:4px;background:#344357;margin-top:9px;border-radius:4px;overflow:hidden}.progress span{height:100%;display:block;background:var(--gold)}.section{margin-top:28px}.section h2{margin:0 0 14px;font-size:20px}.empty{border:1px dashed #36516d;border-radius:14px;padding:26px;color:var(--muted);text-align:center}.bottomnav{display:none;position:fixed;z-index:30;bottom:0;left:0;right:0;background:#08101df2;border-top:1px solid #29415c;backdrop-filter:blur(14px);padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-size:10px;padding:5px}.bottomnav button.active{color:var(--gold)}.bottomnav .ico{font-size:19px}.pageTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 22px}.pageTitle h1{margin:0;font-size:28px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:13px}.field input,.field select,.field textarea{background:#0b1422;border:1px solid #2d455e;border-radius:9px;padding:12px;color:white;width:100%}.field textarea{min-height:90px;resize:vertical}.panel{background:#101a2a;border:1px solid #29415c;border-radius:15px;padding:20px;margin-bottom:16px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{border:1px solid #2b4560;background:#101a2a;color:#b7c6d9;border-radius:20px;padding:8px 13px}.chip.active{background:#00cfff1c;border-color:var(--blue);color:var(--blue)}.detailLayout{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:25px}.detailPoster{width:100%;border-radius:15px;border:1px solid var(--line)}.muted{color:var(--muted)}.episode{display:flex;gap:14px;align-items:center;padding:12px;border-bottom:1px solid #293c52}.episode:last-child{border:0}.episode img{width:105px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#1b2b3e}.episode .grow{flex:1}.episode h4{margin:0 0 5px}.episode p{margin:0;color:var(--muted);font-size:12px}.playerWrap{background:#000;border:1px solid #24394f;border-radius:14px;overflow:hidden}.playerWrap video{display:block;width:100%;max-height:72vh;background:#000}.playerMeta{padding:15px;background:#101a2a}.playerMeta h2{margin:0 0 5px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #293c52;font-size:13px}.table th{color:var(--gold)}.toast{position:fixed;z-index:100;bottom:90px;left:50%;transform:translateX(-50%);background:#f4f7fb;color:#101820;padding:12px 18px;border-radius:10px;box-shadow:0 10px 35px #0008;max-width:90vw;font-weight:700}.modal{position:fixed;inset:0;background:#000b;z-index:80;display:grid;place-items:center;padding:16px}.modalbox{width:min(480px,100%);background:#101a2a;border:1px solid #38516d;border-radius:17px;padding:24px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.xbtn{background:none;color:#fff;border:0;font-size:25px}.notice{background:#2a2416;border:1px solid #6a5423;color:#f4d58c;border-radius:10px;padding:12px;font-size:12px;line-height:1.5}.adminGrid{display:grid;grid-template-columns:200px 1fr;gap:18px}.adminSide{display:flex;flex-direction:column;gap:7px}.adminSide button{text-align:left}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#0b1422;border:1px solid #2b4057;border-radius:11px;padding:15px}.stat strong{display:block;font-size:25px;color:var(--gold)}.stat small{color:var(--muted)}.foot{text-align:center;color:#718198;font-size:11px;padding:30px 10px}.plan{border:1px solid #304963;border-radius:12px;padding:18px;background:#0b1422}.plan h3{margin:0 0 8px}.plan .price{font-size:27px;color:var(--gold);font-weight:900}.plan ul{color:var(--muted);padding-left:20px;line-height:1.9}.planGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.settingsItem{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #293c52}.settingsItem:last-child{border:0}
@media(max-width:1000px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.navlinks{gap:0}.navbtn{padding:9px 8px}.searchbox{width:170px}.hero{min-height:330px}}
@media(max-width:700px){.topbar{height:60px;padding:0 12px;gap:8px}.brand{min-width:unset;font-size:18px}.brand .brandText{display:none}.logo{width:38px;height:32px}.navlinks{display:none}.searchbox{width:100%;min-width:0}.topactions{flex:1}.topactions .loginTop{display:none}.page{padding:14px}.hero{padding:22px;min-height:350px;background-position:60% center}.hero h1{font-size:36px}.hero p{font-size:13px}.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.cardinfo{padding:8px}.cardinfo strong{font-size:12px}.cardinfo small{font-size:10px}.rowhead h2,.section h2{font-size:18px}.bottomnav{display:flex}.formgrid,.detailLayout,.adminGrid{grid-template-columns:1fr}.detailPoster{max-width:220px}.planGrid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat strong{font-size:20px}.pageTitle h1{font-size:24px}.table{min-width:560px}.tableWrap{overflow:auto}.episode{padding:9px}.episode img{width:85px}}
@media(max-width:390px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:320px}.topbar{gap:6px}.iconbtn{padding:8px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<button class="brand" onclick="navigate('home')" aria-label="STAR 7 Home"><span class="logo">S</span><span class="brandText">STAR <b>7</b></span></button>
<nav class="navlinks" aria-label="Main navigation">
<button class="navbtn active" data-page="home" onclick="navigate('home')">Home</button>
<button class="navbtn" data-page="movies" onclick="navigate('movies')">Movies & Shows</button>
<button class="navbtn" data-page="sports" onclick="navigate('sports')">Sports</button>
<button class="navbtn" data-page="library" onclick="navigate('library')">My Library</button>
<button class="navbtn" data-page="plans" onclick="navigate('plans')">Premium</button>
</nav>
<div class="topactions"><input id="globalSearch" class="searchbox" placeholder="Search movies, shows..." aria-label="Search" onkeydown="if(event.key==='Enter')doSearch(this.value)"><button class="iconbtn" onclick="navigate('notifications')" title="Notifications">♧</button><button class="primary loginTop" onclick="openAuth()">Login</button><button class="iconbtn" onclick="navigate('profile')" title="Profile">●</button></div>
</header>
<main id="main" class="page"></main>
<footer class="foot">STAR 7 · Your entertainment universe · Demo build — connect production services before public launch.</footer>
</div>
<nav class="bottomnav">
<button data-page="home" class="active" onclick="navigate('home')"><span class="ico">⌂</span>Home</button>
<button data-page="search" onclick="navigate('search')"><span class="ico">⌕</span>Search</button>
<button data-page="sports" onclick="navigate('sports')"><span class="ico">▣</span>Sports</button>
<button data-page="library" onclick="navigate('library')"><span class="ico">♡</span>Library</button>
<button data-page="profile" onclick="navigate('profile')"><span class="ico">●</span>My Space</button>
</nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const STORE='star7_global_ott_v1';
const sampleVideo='https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
const initialContent=[
{id:'s7-001',title:'The House',type:'Original Series',genre:'Drama',year:2026,rating:'U/A 13+',premium:false,description:'A family secret changes everything in this STAR 7 original story. Watch the mystery unfold episode by episode.',poster:'https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=600&q=80',banner:'https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1600&q=85',video:sampleVideo,seasons:[{name:'Season 1',episodes:[{id:'s7-001-e1',title:'A New Beginning',number:1,description:'A new arrival brings an unexpected secret.',video:sampleVideo},{id:'s7-001-e2',title:'The Hidden Room',number:2,description:'An old room holds a new mystery.',video:sampleVideo},{id:'s7-001-e3',title:'The Letter',number:3,description:'A letter changes the family forever.',video:sampleVideo}]}]},
{id:'s7-002',title:'City Lights',type:'Movie',genre:'Thriller',year:2025,rating:'U/A 16+',premium:true,description:'A gripping city thriller about choices, trust and a race against time.',poster:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-003',title:'Wild Earth',type:'Documentary',genre:'Nature',year:2025,rating:'U',premium:false,description:'Explore the beauty and wonder of the natural world.',poster:'https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-004',title:'Final Over',type:'Sports',genre:'Sports',year:2026,rating:'U',premium:true,description:'A sports documentary about teamwork, pressure and one final chance.',poster:'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-005',title:'Laugh Club',type:'Reality Show',genre:'Comedy',year:2026,rating:'U/A 13+',premium:false,description:'Friends, funny challenges and unforgettable moments.',poster:'https://images.unsplash.com/photo-1527224857830-43a7acc85260?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-006',title:'Midnight Run',type:'Movie',genre:'Action',year:2024,rating:'U/A 16+',premium:true,description:'One night. One mission. No second chances.',poster:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-007',title:'Food Stories',type:'Reality Show',genre:'Lifestyle',year:2026,rating:'U',premium:false,description:'A joyful journey through regional food and home kitchens.',poster:'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-008',title:'Beyond the Hills',type:'Movie',genre:'Adventure',year:2025,rating:'U/A 13+',premium:false,description:'A journey into the mountains becomes a journey of discovery.',poster:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-009',title:'Hidden Truth',type:'Original Series',genre:'Mystery',year:2026,rating:'U/A 16+',premium:true,description:'Nothing is what it first appears in this mystery series.',poster:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=600&q=80',video:sampleVideo,seasons:[{name:'Season 1',episodes:[{id:'s7-009-e1',title:'The Call',number:1,description:'A call from the past begins the story.',video:sampleVideo},{id:'s7-009-e2',title:'No Witnesses',number:2,description:'The clues do not add up.',video:sampleVideo}]}]},
{id:'s7-010',title:'Ocean Deep',type:'Documentary',genre:'Nature',year:2024,rating:'U',premium:false,description:'Discover the extraordinary life beneath the waves.',poster:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=600&q=80',video:sampleVideo},
{id:'s7-011',title:'Campus Days',type:'Original Series',genre:'Drama',year:2026,rating:'U/A 13+',premium:false,description:'Friendship and ambition collide during college life.',poster:'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=600&q=80',video:sampleVideo,seasons:[{name:'Season 1',episodes:[{id:'s7-011-e1',title:'First Day',number:1,description:'Everything starts on the first day.',video:sampleVideo},{id:'s7-011-e2',title:'The Group',number:2,description:'An unlikely group becomes a team.',video:sampleVideo}]}]},
{id:'s7-012',title:'Golden Goal',type:'Sports',genre:'Sports',year:2025,rating:'U',premium:false,description:'The moments that make sports unforgettable.',poster:'https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=600&q=80',video:sampleVideo}
];
function freshState(){return {content:initialContent,watchlist:[],history:[],progress:{},user:null,notifications:[{id:'n1',title:'Welcome to STAR 7',body:'Explore movies, series and more.',read:false}],plans:[{id:'mobile',name:'Mobile',price:99,period:'month',quality:'720p'},{id:'super',name:'Super',price:199,period:'month',quality:'1080p'},{id:'premium',name:'Premium',price:299,period:'month',quality:'4K where available'}],subscription:null,settings:{autoplay:true,language:'English'}}}
let state;
try{state={...freshState(),...JSON.parse(localStorage.getItem(STORE)||'{}')};if(!Array.isArray(state.content)||!state.content.length)state.content=initialContent}catch(e){state=freshState()}
let currentPage='home', currentContentId=null, currentEpisodeId=null, currentFilter='All', adminSection='dashboard', videoEl=null, progressTimer=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){toast('Browser storage is full. Export data from Admin or remove some content.')} }
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',3000)}
function byId(id){return state.content.find(x=>x.id===id)}
function isPremiumActive(){return !!(state.subscription&&state.subscription.status==='active')}
function poster(c){return `<div class="poster"><img loading="lazy" src="${esc(c.poster||'')}" alt="${esc(c.title)} poster" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="fallback" style="display:none">${esc(c.title)}</div>${c.premium?'<span class="lock">✦ PREMIUM</span>':''}${c.year>=2026?'<span class="badge">NEW</span>':''}</div>`}
function card(c){const p=state.progress[c.id]||0;return `<article class="card" tabindex="0" role="button" onclick="openDetails('${esc(c.id)}')" onkeydown="if(event.key==='Enter')openDetails('${esc(c.id)}')">${poster(c)}<div class="cardinfo"><strong>${esc(c.title)}</strong><small>${esc(c.type)} · ${esc(c.year)}</small>${p>0?`<div class="progress"><span style="width:${Math.min(100,p)}%"></span></div>`:''}</div></article>`}
function row(title,items,more=''){if(!items.length)return '';return `<section class="section"><div class="rowhead"><h2>${esc(title)}</h2>${more?`<button class="textbtn" onclick="navigate('${more}')">See all →</button>`:''}</div><div class="cards">${items.map(card).join('')}</div></section>`}
function updateNav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage))}
function navigate(page){currentPage=page;updateNav();const m=document.getElementById('main');window.scrollTo({top:0,behavior:'smooth'});const routes={home:renderHome,movies:()=>renderBrowse('Movies & Shows',state.content.filter(c=>c.type!=='Sports')),sports:()=>renderBrowse('Sports',state.content.filter(c=>c.type==='Sports')),search:renderSearch,library:renderLibrary,plans:renderPlans,profile:renderProfile,notifications:renderNotifications,settings:renderSettings,admin:renderAdmin,history:renderHistory};(routes[page]||renderHome)()}
function renderHome(){const featured=byId('s7-001')||state.content[0];document.getElementById('main').innerHTML=`<section class="hero" style="${featured.banner?`background-image:linear-gradient(90deg,#07101df5 0%,#091421d9 40%,#09142120 100%),linear-gradient(0deg,#07101de8,transparent 65%),url('${esc(featured.banner)}')`:''}"><div class="heroContent"><div class="eyebrow">✦ STAR 7 ORIGINAL · FEATURED</div><h1>${esc(featured.title||'STAR 7 Originals')}</h1><p>${esc(featured.description||'Stories worth staying in for. Discover movies, original series and more.')}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="goldbtn" onclick="playContent('${esc(featured.id)}')">▶ Play Now</button><button class="secondary" onclick="openDetails('${esc(featured.id)}')">ⓘ More Info</button></div></div></section>
${row('Continue Watching',state.history.slice().sort((a,b)=>b.updated-a.updated).map(h=>byId(h.contentId)).filter(Boolean).filter(c=>(state.progress[c.id]||0)>0),'library')}
${row('New on STAR 7',state.content.slice().filter(c=>c.year>=2026).slice(0,6),'movies')}
${row('Movies & Shows',state.content.filter(c=>c.type==='Movie'||c.type==='Original Series'),'movies')}
${row('Reality & Entertainment',state.content.filter(c=>c.type==='Reality Show'||c.type==='Documentary'),'movies')}
${row('Sports',state.content.filter(c=>c.type==='Sports'),'sports')}
${row('Top Picks for You',state.content.slice().reverse().slice(0,6),'movies')}
${!state.user?`<section class="section panel"><h2>Make STAR 7 yours</h2><p class="muted">Sign in on this demo to keep your watchlist and progress in this browser.</p><button class="primary" onclick="openAuth()">Sign in / Create profile</button></section>`:''}`}
function renderBrowse(title,items){document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>${esc(title)}</h1><span class="muted">${items.length} titles</span></div><div class="chips">${['All','Movie','Original Series','Reality Show','Documentary','Sports','Drama','Comedy','Action','Mystery','Nature'].map(x=>`<button class="chip ${currentFilter===x?'active':''}" onclick="filterBrowse('${x}','${title==='Sports'?'sports':'movies'}')">${x}</button>`).join('')}</div><div id="browseCards" class="cards">${items.filter(c=>currentFilter==='All'||c.type===currentFilter||c.genre===currentFilter).map(card).join('')||'<div class="empty">No titles in this category yet.</div>'}</div>`}
function filterBrowse(f,p){currentFilter=f;navigate(p)}
function doSearch(q){currentPage='search';updateNav();document.getElementById('globalSearch').value=q||'';renderSearch(q)}
function renderSearch(q=''){q=q||document.getElementById('globalSearch').value||'';const res=state.content.filter(c=>(c.title+' '+c.genre+' '+c.type+' '+c.description).toLowerCase().includes(q.toLowerCase()));document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>Search</h1></div><div class="panel"><label class="field">Find your next favourite<input id="searchInput" value="${esc(q)}" placeholder="Search titles, genres..." oninput="renderSearch(this.value)"></label></div><p class="muted">${q?`${res.length} result(s) for “${esc(q)}”`:'Popular and recommended titles'}</p><div class="cards">${(q?res:state.content.slice(0,8)).map(card).join('')||'<div class="empty">No results found. Try another title or genre.</div>'}</div>`;const input=document.getElementById('searchInput');if(input){input.focus();input.setSelectionRange(q.length,q.length)}}
function renderLibrary(){const watched=state.history.slice().sort((a,b)=>b.updated-a.updated).map(h=>byId(h.contentId)).filter(Boolean);const fav=state.watchlist.map(byId).filter(Boolean);document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>My Library</h1><button class="secondary" onclick="navigate('history')">Watch History</button></div>${row('Continue Watching',watched.filter(c=>(state.progress[c.id]||0)>0))||'<div class="empty">Videos you start watching will appear here.</div>'}${row('My Watchlist',fav)||'<section class="section"><h2>My Watchlist</h2><div class="empty">Save movies and shows with the ＋ Watchlist button on a title.</div></section>'}`}
function renderHistory(){const items=state.history.slice().sort((a,b)=>b.updated-a.updated);document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>Watch History</h1><button class="danger" onclick="if(confirm('Clear all watch history and progress?')){state.history=[];state.progress={};save();renderHistory()}">Clear history</button></div>${items.length?`<div class="cards">${items.map(h=>byId(h.contentId)).filter(Boolean).map(card).join('')}</div>`:'<div class="empty">Your viewing history will appear here.</div>'}`}
function openDetails(id){const c=byId(id);if(!c)return toast('Title not found');currentContentId=id;const eps=(c.seasons||[]).flatMap(s=>s.episodes.map(e=>({...e,season:s.name})));document.getElementById('main').innerHTML=`<div class="pageTitle"><button class="textbtn" onclick="navigate('home')">← Back</button><span class="muted">${esc(c.type)}</span></div><div class="detailLayout"><div>${poster(c).replace('class="poster"','class="poster detailPoster"')}</div><div><div class="eyebrow">STAR 7 ${c.premium?'PREMIUM':'SELECT'}</div><h1 style="font-size:clamp(28px,4vw,44px);margin:10px 0">${esc(c.title)}</h1><p class="muted">${esc(c.year)} · ${esc(c.rating||'U/A')} · ${esc(c.genre)} · ${esc(c.type)}</p><p style="line-height:1.7;max-width:700px">${esc(c.description||'Discover this title on STAR 7.')}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:20px 0"><button class="goldbtn" onclick="playContent('${esc(c.id)}')">▶ ${state.progress[c.id]?'Continue Watching':'Play Now'}</button><button class="secondary" onclick="toggleWatchlist('${esc(c.id)}')">${state.watchlist.includes(c.id)?'✓ In Watchlist':'＋ Watchlist'}</button><button class="secondary" onclick="shareTitle('${esc(c.id)}')">↗ Share</button></div>${c.premium&&!isPremiumActive()?'<div class="notice">This is a Premium title. Choose a plan to unlock it. The demo does not process real payments.</div><button class="goldbtn" style="margin-top:12px" onclick="navigate(\\'plans\\')">View Plans</button>':''}</div></div>${eps.length?`<section class="section"><h2>Episodes</h2><div class="panel">${eps.map(e=>`<div class="episode"><img src="${esc(c.poster)}" alt=""><div class="grow"><h4>${esc(e.season)} · Episode ${e.number}: ${esc(e.title)}</h4><p>${esc(e.description||'')}</p></div><button class="primary" onclick="playContent('${esc(c.id)}','${esc(e.id)}')">▶ Play</button></div>`).join('')}</div></section>`:''}`}
function toggleWatchlist(id){state.watchlist=state.watchlist.includes(id)?state.watchlist.filter(x=>x!==id):[...state.watchlist,id];save();toast(state.watchlist.includes(id)?'Added to My Watchlist':'Removed from My Watchlist');openDetails(id)}
function shareTitle(id){const c=byId(id);if(navigator.share)navigator.share({title:c.title,text:`Watch ${c.title} on STAR 7`}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(location.href+'#'+id).then(()=>toast('Share link copied')).catch(()=>toast('Sharing is not available in this browser'));else toast('Sharing is not available in this browser')}
function getEpisode(c,eid){for(const s of c.seasons||[])for(const e of s.episodes)if(e.id===eid)return {...e,season:s.name};return null}
function playContent(id,eid=null){const c=byId(id);if(!c)return;if(c.premium&&!isPremiumActive()){toast('Premium title — choose a plan first');navigate('plans');return}currentContentId=id;currentEpisodeId=eid;const e=eid?getEpisode(c,eid):null;const title=e?`${c.title} · ${e.season} E${e.number}: ${e.title}`:c.title;document.getElementById('main').innerHTML=`<div class="pageTitle"><button class="textbtn" onclick="openDetails('${esc(id)}')">← Back to details</button><span class="muted">STAR 7 Player</span></div><div class="playerWrap"><video id="player" controls playsinline preload="metadata" poster="${esc(c.poster||'')}" src="${esc((e&&e.video)||c.video||sampleVideo)}"></video><div class="playerMeta"><h2>${esc(title)}</h2><p class="muted">${esc(c.description||'')}</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="secondary" onclick="toggleWatchlist('${esc(id)}')">${state.watchlist.includes(id)?'✓ Watchlisted':'＋ Watchlist'}</button>${c.seasons?'<button class="secondary" onclick="openDetails(\\''+esc(id)+'\\')">Episodes</button>':''}<button class="secondary" onclick="shareTitle('${esc(id)}')">↗ Share</button><label class="secondary" style="display:flex;align-items:center;gap:7px">Speed <select id="speed" onchange="document.getElementById('player').playbackRate=Number(this.value)" style="background:#24374e;color:white;border:0"><option>1</option><option value=".75">0.75</option><option value="1.25">1.25</option><option value="1.5">1.5</option><option value="2">2</option></select></label></div></div></div><p class="muted" style="font-size:12px;margin-top:12px">Playback progress is saved in this browser. Production cross-device sync requires a backend.</p>`;videoEl=document.getElementById('player');const key=id;videoEl.addEventListener('loadedmetadata',()=>{const p=state.progress[key]||0;if(p>2&&p<95&&videoEl.duration)videoEl.currentTime=videoEl.duration*p/100;});videoEl.addEventListener('timeupdate',()=>{if(!videoEl.duration||!isFinite(videoEl.duration))return;state.progress[key]=Math.round(videoEl.currentTime/videoEl.duration*100);const h=state.history.find(x=>x.contentId===key);if(h)h.updated=Date.now();else state.history.push({contentId:key,updated:Date.now()});save()});videoEl.addEventListener('ended',()=>{state.progress[key]=100;save();toast('Playback finished');});videoEl.play().catch(()=>{});}
function renderPlans(){document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>STAR 7 Premium</h1><span class="muted">Choose a plan</span></div><div class="notice" style="margin-bottom:18px">Demo checkout only. These sample plans do not charge money or activate real billing. Connect a verified payment provider and server-side subscription validation before launch.</div><div class="planGrid">${state.plans.map(p=>`<div class="plan"><div class="eyebrow">STAR 7 ${p.name.toUpperCase()}</div><h3>${esc(p.name)} Plan</h3><div class="price">₹${Number(p.price)}<small style="font-size:12px;color:var(--muted)">/${esc(p.period)}</small></div><ul><li>${esc(p.quality)} streaming where available</li><li>Movies and series</li><li>Cancel according to provider terms</li></ul><button class="goldbtn" style="width:100%" onclick="demoSubscribe('${esc(p.id)}')">${isPremiumActive()?'Current demo plan':'Choose plan'}</button></div>`).join('')}</div><section class="section panel"><h2>Subscription status</h2><p>${isPremiumActive()?`Demo subscription active: ${esc(state.subscription.planName)}.`:'No active subscription.'}</p><button class="secondary" onclick="toast('Real billing is not connected in this demo.')">Manage subscription</button></section>`}
function demoSubscribe(id){const p=state.plans.find(x=>x.id===id);if(!p)return;openModal(`<div class="modalhead"><h2>Demo checkout</h2><button class="xbtn" onclick="closeModal()">×</button></div><p>You selected <b>${esc(p.name)}</b> for ₹${p.price}/${esc(p.period)}.</p><div class="notice">This is a local demo confirmation. No payment is collected and this must not be used to grant real paid access in production.</div><button class="goldbtn" style="width:100%;margin-top:15px" onclick="state.subscription={status:'active',planId:'${esc(p.id)}',planName:'${esc(p.name)}',started:Date.now(),demo:true};save();closeModal();renderPlans();toast('Demo plan activated in this browser')">Confirm demo plan</button>`)}
function openAuth(){openModal(`<div class="modalhead"><h2>Welcome to STAR 7</h2><button class="xbtn" onclick="closeModal()">×</button></div><p class="muted">Create a local demo profile. This form does not send SMS OTP.</p><form onsubmit="event.preventDefault();demoLogin()"><label class="field">Your name<input id="authName" required maxlength="60" placeholder="Enter your name"></label><label class="field" style="margin-top:12px">Mobile number (optional)<input id="authPhone" inputmode="tel" maxlength="20" placeholder="+91"></label><div class="notice" style="margin-top:14px">Production login needs a real authentication provider and OTP verification. Never trust a client-only OTP for security.</div><button class="primary" style="width:100%;margin-top:15px">Continue in demo</button></form>`)}
function demoLogin(){const name=document.getElementById('authName').value.trim(),phone=document.getElementById('authPhone').value.trim();if(!name)return;state.user={name,phone,created:Date.now(),demo:true};save();closeModal();toast('Signed in locally as '+name);navigate('profile')}
function renderProfile(){document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>My Space</h1><button class="secondary" onclick="navigate('settings')">⚙ Settings</button></div><div class="panel" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div class="logo" style="width:70px;height:70px;border-radius:50%;font-size:35px">S</div><div style="flex:1"><h2 style="margin:0 0 6px">${esc(state.user?.name||'Guest User')}</h2><p class="muted" style="margin:0">${state.user?.phone?esc(state.user.phone):'Not signed in'} ${state.user?.demo?'· Local demo profile':''}</p></div>${state.user?'<button class="danger" onclick="if(confirm(\\'Sign out?\\')){state.user=null;save();renderProfile()}">Sign out</button>':'<button class="primary" onclick="openAuth()">Sign in</button>'}</div><div class="statgrid"><div class="stat"><strong>${state.history.length}</strong><small>Titles watched</small></div><div class="stat"><strong>${state.watchlist.length}</strong><small>Watchlist</small></div><div class="stat"><strong>${isPremiumActive()?'Active':'Free'}</strong><small>Plan status</small></div></div><section class="section panel"><h2>Account</h2><div class="settingsItem"><span>My Library</span><button class="secondary" onclick="navigate('library')">Open</button></div><div class="settingsItem"><span>Notifications</span><button class="secondary" onclick="navigate('notifications')">Open</button></div><div class="settingsItem"><span>Subscription</span><button class="secondary" onclick="navigate('plans')">Manage</button></div><div class="settingsItem"><span>Admin Dashboard</span><button class="secondary" onclick="openAdminLogin()">Open Admin</button></div></section>`}
function renderSettings(){document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>Settings</h1><button class="textbtn" onclick="navigate('profile')">← My Space</button></div><div class="panel"><div class="settingsItem"><span>Autoplay next episode</span><input type="checkbox" ${state.settings.autoplay?'checked':''} onchange="state.settings.autoplay=this.checked;save()"></div><div class="settingsItem"><span>App language</span><select onchange="state.settings.language=this.value;save()" style="background:#0b1422;color:white;padding:8px;border:1px solid var(--line);border-radius:8px"><option ${state.settings.language==='English'?'selected':''}>English</option><option ${state.settings.language==='বাংলা'?'selected':''}>বাংলা</option><option ${state.settings.language==='Hindi'?'selected':''}>Hindi</option></select></div><div class="settingsItem"><span>Privacy and account</span><button class="secondary" onclick="toast('Production privacy tools must be connected to your backend.')">Details</button></div><div class="settingsItem"><span>Export local demo data</span><button class="secondary" onclick="exportData()">Export JSON</button></div><div class="settingsItem"><span>Reset demo data</span><button class="danger" onclick="if(confirm('Reset this browser app to initial demo data?')){localStorage.removeItem(STORE);location.reload()}">Reset</button></div></div>`}
function renderNotifications(){document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>Notifications</h1><button class="textbtn" onclick="state.notifications.forEach(n=>n.read=true);save();renderNotifications()">Mark all read</button></div>${state.notifications.length?state.notifications.slice().reverse().map(n=>`<div class="panel" style="${n.read?'opacity:.65':''}"><div style="display:flex;justify-content:space-between;gap:12px"><div><strong>${esc(n.title)}</strong><p class="muted">${esc(n.body)}</p></div>${n.read?'':'<span class="badge" style="position:static;height:max-content">NEW</span>'}</div></div>`).join(''):'<div class="empty">No notifications.</div>'}`}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openAdminLogin(){openModal(`<div class="modalhead"><h2>Admin access</h2><button class="xbtn" onclick="closeModal()">×</button></div><p class="muted">Demo-only gate. This is not secure authentication.</p><form onsubmit="event.preventDefault();const p=document.getElementById('adminPin').value;if(p==='STAR7-DEMO'){closeModal();navigate('admin')}else toast('Incorrect demo key')"><label class="field">Demo key<input id="adminPin" type="password" required placeholder="Enter demo key"></label><p class="muted" style="font-size:12px">Default demo key: STAR7-DEMO</p><button class="primary" style="width:100%">Open dashboard</button></form>`)}
function renderAdmin(){const total=state.content.length;document.getElementById('main').innerHTML=`<div class="pageTitle"><h1>Admin Dashboard</h1><button class="secondary" onclick="navigate('profile')">Exit Admin</button></div><div class="notice" style="margin-bottom:16px">DEMO ADMIN ONLY. Content changes are stored in this browser. Before production, replace this client-side gate with server-side role-based access control.</div><div class="statgrid"><div class="stat"><strong>${total}</strong><small>Titles</small></div><div class="stat"><strong>${state.history.length}</strong><small>Watch records</small></div><div class="stat"><strong>${state.watchlist.length}</strong><small>Saved items</small></div></div><div class="chips"><button class="chip ${adminSection==='dashboard'?'active':''}" onclick="adminSection='dashboard';renderAdmin()">Content Library</button><button class="chip ${adminSection==='add'?'active':''}" onclick="adminSection='add';renderAdmin()">＋ Add Content</button><button class="chip" onclick="exportData()">Export Data</button><button class="chip" onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div>${adminSection==='add'?`<div class="panel"><h2>Add a title</h2><form onsubmit="event.preventDefault();addContent()"><div class="formgrid"><label class="field">Title *<input id="cTitle" required maxlength="100"></label><label class="field">Type<select id="cType"><option>Movie</option><option>Original Series</option><option>Reality Show</option><option>Documentary</option><option>Sports</option></select></label><label class="field">Genre<input id="cGenre" value="Drama"></label><label class="field">Year<input id="cYear" type="number" value="2026" min="1900" max="2100"></label><label class="field">Poster image URL<input id="cPoster" type="url" placeholder="https://..."></label><label class="field">Video URL<input id="cVideo" type="url" placeholder="https://...mp4 or HLS URL"></label><label class="field">Rating<select id="cRating"><option>U</option><option>U/A 13+</option><option>U/A 16+</option><option>A</option></select></label><label class="field">Access<select id="cPremium"><option value="false">Free</option><option value="true">Premium</option></select></label><label class="field" style="grid-column:1/-1">Description<textarea id="cDesc"></textarea></label></div><button class="primary" style="margin-top:14px">Save content</button></form></div>`:`<div class="panel"><div class="tableWrap"><table class="table"><thead><tr><th>Title</th><th>Type</th><th>Access</th><th>Action</th></tr></thead><tbody>${state.content.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(c.type)}</td><td>${c.premium?'Premium':'Free'}</td><td><button class="secondary" onclick="openDetails('${esc(c.id)}')">View</button> <button class="danger" onclick="deleteContent('${esc(c.id)}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}`}
function addContent(){const title=document.getElementById('cTitle').value.trim();if(!title)return;const c={id:'custom-'+Date.now(),title,type:document.getElementById('cType').value,genre:document.getElementById('cGenre').value||'Drama',year:Number(document.getElementById('cYear').value)||2026,rating:document.getElementById('cRating').value,premium:document.getElementById('cPremium').value==='true',description:document.getElementById('cDesc').value,poster:document.getElementById('cPoster').value||'',video:document.getElementById('cVideo').value||sampleVideo};state.content.unshift(c);state.notifications.push({id:'n'+Date.now(),title:'New on STAR 7: '+title,body:'A new title was added to the library.',read:false});save();adminSection='dashboard';renderAdmin();toast('Content added')}
function deleteContent(id){const c=byId(id);if(!c||!confirm('Delete '+c.title+'?'))return;state.content=state.content.filter(x=>x.id!==id);state.watchlist=state.watchlist.filter(x=>x!==id);state.history=state.history.filter(x=>x.contentId!==id);delete state.progress[id];save();renderAdmin();toast('Content deleted')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='star7-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')}
function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.content))throw Error('Invalid data');state={...freshState(),...d};save();renderAdmin();toast('Data imported')}catch(err){toast('Invalid STAR 7 JSON backup')}};reader.readAsText(f)}
function boot(){updateNav();renderHome();if(location.hash.length>1){const id=location.hash.slice(1);if(byId(id))openDetails(id)}}
boot();
</script>
</body>
</html>
